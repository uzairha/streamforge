version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
    - errorlint
    - bodyclose
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/uzairha/streamforge
