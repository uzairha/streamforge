{{- if .Values.infra.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamforge.fullname" . }}-grafana-provisioning
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # Same uid the compose provisioning pins, so the dashboards resolve
        # their datasource identically in both environments.
        uid: prometheus
        access: proxy
        url: http://{{ include "streamforge.fullname" . }}-prometheus:{{ .Values.infra.prometheus.port }}
        isDefault: true
        editable: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: streamforge
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamforge.fullname" . }}-grafana-dashboards
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  # Embedded from the chart's own dashboards/ directory — Helm can only read
  # files inside the chart, which is why that directory is the canonical home
  # for them and docker-compose mounts it from there.
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamforge.fullname" . }}-grafana
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: NodePort
  selector:
    {{- include "streamforge.selectorLabels" (dict "root" . "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.infra.grafana.port }}
      targetPort: http
      nodePort: {{ .Values.infra.grafana.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamforge.fullname" . }}-grafana
  labels:
    {{- include "streamforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "streamforge.selectorLabels" (dict "root" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        # Checksum the dashboard files themselves, not this template: including
        # this file from inside itself recurses.
        checksum/dashboards: {{ .Files.Glob "dashboards/*.json" | toYaml | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.infra.grafana.image }}
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.infra.grafana.adminPassword | quote }}
            - name: GF_USERS_DEFAULT_THEME
              value: light
          ports:
            - name: http
              containerPort: {{ .Values.infra.grafana.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning-datasources
          configMap:
            name: {{ include "streamforge.fullname" . }}-grafana-provisioning
            items:
              - key: datasource.yml
                path: datasource.yml
        - name: provisioning-dashboards
          configMap:
            name: {{ include "streamforge.fullname" . }}-grafana-provisioning
            items:
              - key: dashboards.yml
                path: dashboards.yml
        - name: dashboards
          configMap:
            name: {{ include "streamforge.fullname" . }}-grafana-dashboards
{{- end }}
